<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remote Live Stream & Telemetry</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: #161b22; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; }
    .status-badge { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #da3633; }
    .dot.online { background: #238636; box-shadow: 0 0 8px #238636; }
    main { display: grid; grid-template-columns: 1fr 340px; gap: 16px; padding: 16px; flex: 1; min-height: 0; }
    .video-container { background: #000; border-radius: 8px; border: 1px solid #30363d; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .controls-overlay { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; background: rgba(22, 27, 34, 0.85); padding: 8px 16px; border-radius: 30px; border: 1px solid #30363d; }
    button { background: #238636; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; transition: background 0.2s; }
    button:hover { background: #2ea043; }
    button.btn-sec { background: #21262d; border: 1px solid #30363d; }
    button.btn-sec:hover { background: #30363d; }
    .sidebar { background: #161b22; border-radius: 8px; border: 1px solid #30363d; display: flex; flex-direction: column; padding: 16px; gap: 16px; overflow-y: auto; }
    .card { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px; }
    .card h3 { font-size: 13px; text-transform: uppercase; color: #8b949e; margin-bottom: 8px; letter-spacing: 0.5px; }
    .metric-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; border-bottom: 1px solid #21262d; }
    .metric-row:last-child { border-bottom: none; }
    .val { color: #58a6ff; font-family: monospace; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <h2>Remote Camera & Telemetry Dashboard</h2>
    <div class="status-badge">
      <div id="phone-dot" class="dot"></div>
      <span id="phone-status-text">Phone Offline</span>
    </div>
  </header>

  <main>
    <div class="video-container">
      <video id="remote-video" autoplay playsinline></video>
      <div class="controls-overlay">
        <button id="btn-start" onclick="startViewing()">Start Remote View</button>
        <button class="btn-sec" onclick="sendCommand('switch_camera')">🔄 Switch Camera</button>
      </div>
    </div>

    <div class="sidebar">
      <div class="card">
        <h3>Stream Metrics</h3>
        <div class="metric-row"><span>Signaling:</span><span id="sig-status" class="val">Connecting</span></div>
        <div class="metric-row"><span>WebRTC State:</span><span id="rtc-status" class="val">Idle</span></div>
        <div class="metric-row"><span>Latency:</span><span id="metric-ping" class="val">-- ms</span></div>
      </div>

      <div class="card">
        <h3>GPS Location</h3>
        <div class="metric-row"><span>Latitude:</span><span id="gps-lat" class="val">--</span></div>
        <div class="metric-row"><span>Longitude:</span><span id="gps-lng" class="val">--</span></div>
        <div class="metric-row"><span>Accuracy:</span><span id="gps-acc" class="val">-- m</span></div>
      </div>

      <div class="card">
        <h3>Device Orientation</h3>
        <div class="metric-row"><span>Pitch (X):</span><span id="ori-x" class="val">--°</span></div>
        <div class="metric-row"><span>Roll (Y):</span><span id="ori-y" class="val">--°</span></div>
        <div class="metric-row"><span>Azimuth (Z):</span><span id="ori-z" class="val">--°</span></div>
      </div>
    </div>
  </main>

  <script>
    const socket = io();
    let peerConnection = null;
    const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    socket.on('connect', () => {
      document.getElementById('sig-status').innerText = 'Connected';
      socket.emit('register', 'viewer');
    });

    socket.on('phone_status', (data) => {
      const dot = document.getElementById('phone-dot');
      const txt = document.getElementById('phone-status-text');
      if (data.online) {
        dot.className = 'dot online';
        txt.innerText = 'Phone Online & Ready';
      } else {
        dot.className = 'dot';
        txt.innerText = 'Phone Offline';
      }
    });

    socket.on('telemetry', (data) => {
      if (data.gps) {
        document.getElementById('gps-lat').innerText = Number(data.gps.latitude || 0).toFixed(6);
        document.getElementById('gps-lng').innerText = Number(data.gps.longitude || 0).toFixed(6);
        document.getElementById('gps-acc').innerText = Number(data.gps.accuracy || 0).toFixed(1);
      }
      if (data.orientation) {
        document.getElementById('ori-x').innerText = Number(data.orientation.pitch || 0).toFixed(1);
        document.getElementById('ori-y').innerText = Number(data.orientation.roll || 0).toFixed(1);
        document.getElementById('ori-z').innerText = Number(data.orientation.azimuth || 0).toFixed(1);
      }
    });

    socket.on('signal', async (data) => {
      if (!peerConnection) createPeerConnection();

      if (data.type === 'offer') {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit('signal', { type: 'answer', sdp: answer });
      } else if (data.type === 'candidate' && data.candidate) {
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        } catch (e) {
          console.error('ICE candidate error', e);
        }
      }
    });

    function createPeerConnection() {
      peerConnection = new RTCPeerConnection(config);

      peerConnection.ontrack = (event) => {
        const video = document.getElementById('remote-video');
        if (video.srcObject !== event.streams[0]) {
          video.srcObject = event.streams[0];
        }
      };

      peerConnection.onconnectionstatechange = () => {
        document.getElementById('rtc-status').innerText = peerConnection.connectionState;
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('signal', { type: 'candidate', candidate: event.candidate });
        }
      };
    }

    function startViewing() {
      sendCommand('start_stream');
      document.getElementById('btn-start').innerText = 'Requesting Stream...';
    }

    function sendCommand(action) {
      socket.emit('command', { action });
    }
  </script>
</body>
</html>
